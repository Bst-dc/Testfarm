<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>내 시스템 허브</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
    body { font-family: 'Pretendard', sans-serif; }
</style>
</head>
<body class="min-h-screen bg-slate-50 flex items-center justify-center p-6">
    <div class="w-full max-w-3xl">
        <div class="text-center mb-10">
            <p class="text-indigo-600 font-bold tracking-wider text-sm mb-2">MY SYSTEMS</p>
            <h1 class="text-3xl md:text-4xl font-extrabold text-slate-900">사용할 시스템을 선택하세요</h1>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <!-- 시험농장 -->
            <a href="https://farm.mydomain.com" class="group block bg-white rounded-2xl border border-slate-200 shadow-sm hover:shadow-xl hover:-translate-y-1 transition-all p-8">
                <div class="w-14 h-14 rounded-xl bg-emerald-100 flex items-center justify-center text-3xl mb-5">🐄</div>
                <h2 class="text-xl font-bold text-slate-900 mb-2">한우 시험농장 관리</h2>
                <p class="text-sm text-slate-500 leading-relaxed">개체 입식·사양 관리, 비용 정산, 결산 리포트</p>
                <div class="mt-6 flex items-center text-emerald-600 font-bold text-sm">
                    바로가기
                    <span class="ml-1 group-hover:translate-x-1 transition-transform">→</span>
                </div>
            </a>

            <!-- 스마트웹시스템 -->
            <a href="https://web.mydomain.com" class="group block bg-white rounded-2xl border border-slate-200 shadow-sm hover:shadow-xl hover:-translate-y-1 transition-all p-8">
                <div class="w-14 h-14 rounded-xl bg-indigo-100 flex items-center justify-center text-3xl mb-5">💻</div>
                <h2 class="text-xl font-bold text-slate-900 mb-2">스마트웹시스템</h2>
                <p class="text-sm text-slate-500 leading-relaxed">(여기에 스마트웹시스템 설명을 채워 넣으세요)</p>
                <div class="mt-6 flex items-center text-indigo-600 font-bold text-sm">
                    바로가기
                    <span class="ml-1 group-hover:translate-x-1 transition-transform">→</span>
                </div>
            </a>
        </div>

        <p class="text-center text-xs text-slate-400 mt-10">이 페이지는 로그인 화면이 아닙니다. 각 시스템 접속 시 자체 비밀번호를 입력합니다.</p>
    </div>
</body>
</html>
